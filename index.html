<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>현미숙 FC 영업비서</title>
<meta name="description" content="현미숙 FC 개인용 보험 영업관리·상담 도우미">
<meta name="theme-color" content="#102a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="현미숙 FC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f7fa;--card:#fff;--ink:#102a43;--sub:#64748b;--line:#e2e8f0;
  --brand:#102a43;--accent:#2563eb;--ok:#16a34a;--warn:#ea580c;--bad:#dc2626;--soft:#eef2f7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* 레이아웃: 휴대폰 = 하단 탭 / PC = 왼쪽 메뉴 */
.sidebar{display:none}
.main{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:rgba(245,247,250,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;padding:12px 0;padding-top:calc(12px + env(safe-area-inset-top))}
.top h1{font-size:19px;margin:0;flex:1}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;font-size:18px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--line);box-shadow:0 -3px 15px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;border:0;background:transparent;color:var(--sub);font-size:11px;padding:8px 2px 10px}
.bottom-nav button span{display:block;font-size:21px;line-height:26px}
.bottom-nav button.active{color:var(--ink);font-weight:800}
@media(min-width:700px){
  .bottom-nav{display:none}
  .sidebar{display:block;position:fixed;top:0;bottom:0;left:0;width:210px;background:var(--brand);color:#fff;padding:22px 14px}
  .sidebar .brand{font-weight:800;font-size:17px;margin:0 6px 20px}
  .sidebar button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:11px 12px;border-radius:10px;margin-bottom:4px;font-size:15px}
  .sidebar button.active,.sidebar button:hover{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
  .main{margin-left:210px;padding:0 28px 40px;max-width:1100px}
  .stats{grid-template-columns:repeat(4,1fr)!important}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .formgrid{grid-template-columns:1fr 1fr!important}
}

.page{display:none}
.page.active{display:block}
.hero{background:linear-gradient(135deg,#102a43,#243b53);color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:14px}
.hero h2{margin:0 0 4px;font-size:21px}
.hero p{margin:0;opacity:.85;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px}
.stat small{color:var(--sub);display:block;font-size:12px}
.stat b{font-size:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.muted{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.quick button{min-height:54px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:14px}
.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}

.toolbar{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:4;background:var(--bg);display:flex;gap:8px;padding:4px 0 10px}
.toolbar input,.toolbar select{min-width:0}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;font-size:16px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.formgrid{display:grid;grid-template-columns:1fr;gap:10px}
.formgrid .full{grid-column:1/-1}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px;background:var(--soft);border-radius:8px;padding:8px}
.checks input{width:auto}

.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;background:var(--brand);color:#fff;min-height:44px}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #fecaca}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1}

.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.item .body{flex:1;min-width:0}
.item .name{font-weight:700}
.item .meta{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.overdue{background:#fee2e2;color:var(--bad)}
.tag.today{background:#ffedd5;color:var(--warn)}
.tag.bday{background:#fce7f3;color:#be185d}
.tag.done{background:#dcfce7;color:var(--ok)}
.routine{padding:10px 0;border-bottom:1px solid var(--line)}
.routine:last-child{border-bottom:0}
.star{border:0;background:transparent;font-size:22px;line-height:1;padding:6px;color:#cbd5e1;flex:none}
.star.on{color:#f59e0b}
.btn.sec.on{background:#fef3c7;border-color:#fcd34d;color:#92400e}

.progress{margin-bottom:12px}
.progress .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.done{background:var(--ok)}

.ai-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.ai-buttons .btn{min-height:46px;font-size:14px}
.log{border-left:3px solid var(--line);padding:2px 0 8px 10px;margin-bottom:6px;font-size:14px}
.log b{font-size:12px;color:var(--sub);display:block}

/* 아래에서 올라오는 창 */
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet-head h2{flex:1;margin:0;font-size:18px}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#102a43;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="brand">현미숙 FC 영업비서</div>
  <button data-page="home">🏠 홈</button>
  <button data-page="customers">👥 고객</button>
  <button data-page="prospects">🌱 가망고객</button>
  <button data-page="ceo">🏢 CEO</button>
  <button data-page="goals">🎯 목표</button>
  <button data-page="perf">📊 실적</button>
</nav>

<main class="main">
  <header class="top">
    <h1 id="pageTitle">홈</h1>
    <button class="icon-btn" onclick="openSettings()" aria-label="설정">⚙️</button>
  </header>

  <!-- 홈 -->
  <section class="page" id="page-home">
    <div class="hero"><h2 id="helloText"></h2><p id="todayText"></p></div>
    <div id="backupNotice"></div>
    <div class="card" id="routineCard"></div>
    <div class="stats" id="homeStats"></div>
    <div class="quick">
      <button onclick="editCustomer()">＋ 고객</button>
      <button onclick="editProspect()">＋ 가망</button>
      <button onclick="editCeo()">＋ CEO</button>
      <button onclick="editPerf()">＋ 실적</button>
    </div>
    <div class="grid2">
      <div class="card"><h3>오늘 할 일</h3><ul class="list" id="todoList"></ul></div>
      <div class="card"><h3>이번 달 목표</h3><div id="homeGoals"></div></div>
    </div>
    <div class="card"><h3>⭐ 관심고객</h3><ul class="list" id="starList"></ul></div>
  </section>

  <!-- 개인 고객 -->
  <section class="page" id="page-customers">
    <div class="toolbar">
      <input id="custSearch" placeholder="이름·연락처·메모 검색" oninput="renderCustomers()">
      <select id="custStage" onchange="renderCustomers()" style="max-width:110px"></select>
      <button class="btn sec" id="custStarBtn" onclick="starOnly.c=!starOnly.c;renderCustomers()" aria-label="관심고객만 보기">☆</button>
      <button class="btn" onclick="editCustomer()">＋</button>
    </div>
    <div class="card"><ul class="list" id="custList"></ul></div>
  </section>

  <!-- CEO(법인) 고객 -->
  <section class="page" id="page-ceo">
    <div class="toolbar">
      <input id="ceoSearch" placeholder="회사명·대표자 검색" oninput="renderCeos()">
      <button class="btn sec" id="ceoStarBtn" onclick="starOnly.ceo=!starOnly.ceo;renderCeos()" aria-label="관심고객만 보기">☆</button>
      <button class="btn" onclick="editCeo()">＋</button>
    </div>
    <div class="card"><ul class="list" id="ceoList"></ul></div>
  </section>

  <!-- 가망고객 (아직 상담 전) -->
  <section class="page" id="page-prospects">
    <div class="toolbar">
      <input id="prosSearch" placeholder="이름·소개자·메모 검색" oninput="renderProspects()">
      <button class="btn" onclick="editProspect()">＋</button>
    </div>
    <p class="muted" style="margin:0 2px 10px">아직 상담 전인 분들을 가볍게 적어 두는 곳입니다. 상담이 시작되면 <b>정식 고객으로 전환</b>을 누르세요.</p>
    <div class="card"><ul class="list" id="prosList"></ul></div>
  </section>

  <!-- 목표 -->
  <section class="page" id="page-goals">
    <div class="toolbar"><input type="month" id="goalMonth" onchange="renderGoals()"></div>
    <div class="grid2">
      <div class="card"><h3>진행 현황</h3><div id="goalProgress"></div></div>
      <div class="card">
        <h3>목표 설정</h3>
        <div class="formgrid" id="goalForm"></div>
        <div class="row" style="margin-top:12px"><button class="btn grow" onclick="saveGoals()">목표 저장</button></div>
      </div>
    </div>
  </section>

  <!-- 실적 -->
  <section class="page" id="page-perf">
    <div class="toolbar">
      <input type="month" id="perfMonth" onchange="renderPerf()">
      <button class="btn" onclick="editPerf()">＋</button>
    </div>
    <div class="stats" id="perfStats"></div>
    <div class="card"><h3>계약 목록</h3><ul class="list" id="perfList"></ul></div>
  </section>
</main>

<nav class="bottom-nav" id="bottomNav">
  <button data-page="home"><span>🏠</span>홈</button>
  <button data-page="customers"><span>👥</span>고객</button>
  <button data-page="prospects"><span>🌱</span>가망</button>
  <button data-page="ceo"><span>🏢</span>CEO</button>
  <button data-page="goals"><span>🎯</span>목표</button>
  <button data-page="perf"><span>📊</span>실적</button>
</nav>

<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" onclick="closeSheet()" aria-label="닫기">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden onchange="importData(this)">

<script>
/* ───────── 데이터 저장 (이 기기의 브라우저 안에 저장) ───────── */
const KEY = 'hmsfc_app_v2';
const STAGES = ['관심', '상담중', '제안', '계약', '유지관리'];
const CEO_ISSUES = ['가업승계', '퇴직금 재원', '법인세 절감', '대표 보장', '임원 보장', '직원 복리후생', '가지급금 정리', '주식 가치평가'];
const PAGES = {home: '홈', customers: '고객', prospects: '가망고객', ceo: 'CEO 고객', goals: '목표', perf: '실적'};

function defaults() {
  return {settings: {fcName: '현미숙 FC', lastBackup: ''}, customers: [], prospects: [], ceos: [], goals: {}, perf: [], routines: defaultRoutines(), routineLog: {}};
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d) { const base = defaults(); return {...base, ...d, settings: {...base.settings, ...d.settings}}; }
  } catch (e) {}
  return defaults();
}
let db = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { alert('저장에 실패했습니다. 저장 공간을 확인하고 백업 파일을 내보내 주세요.'); }
}

/* ───────── 작은 도우미 함수 ───────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const thisMonth = () => today().slice(0, 7);
const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);

function age(birth) {
  if (!birth) return '';
  const b = new Date(birth + 'T00:00'), t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a >= 0 ? a + '세' : '';
}
// 다가오는 생일까지 남은 날 (없으면 null)
function daysToBirthday(birth) {
  if (!birth) return null;
  const t = today(), y = Number(t.slice(0, 4));
  let next = y + birth.slice(4);
  if (next < t) next = (y + 1) + birth.slice(4);
  return dayDiff(t, next);
}
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('복사했습니다. 문자·카톡에 붙여넣으세요.');
}
const telHref = p => 'tel:' + String(p || '').replace(/[^0-9+]/g, '');
const smsHref = p => 'sms:' + String(p || '').replace(/[^0-9+]/g, '');

/* ───────── 화면 전환 (주소 끝 #이름 으로 기억 → 뒤로가기 동작) ───────── */
function showPage(id) {
  if (!PAGES[id]) id = 'home';
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + id));
  document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === id));
  $('pageTitle').textContent = PAGES[id];
  render(id);
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => {
  if (location.hash === '#' + b.dataset.page) showPage(b.dataset.page);
  else location.hash = b.dataset.page;
}));
window.addEventListener('hashchange', () => showPage(location.hash.slice(1)));

function render(id) {
  ({home: renderHome, customers: renderCustomers, prospects: renderProspects, ceo: renderCeos, goals: renderGoals, perf: renderPerf})[id]();
}
function refresh() { render(location.hash.slice(1) in PAGES ? location.hash.slice(1) : 'home'); }

/* ───────── 아래에서 올라오는 창 ───────── */
function openSheet(title, html) {
  $('sheetTitle').textContent = title; $('sheetBody').innerHTML = html;
  $('sheetBg').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeSheet() { $('sheetBg').classList.remove('open'); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// 입력 칸 목록으로 폼 HTML 만들기
function formHtml(fields, data) {
  return '<div class="formgrid">' + fields.map(f => {
    const v = esc(data[f.k] ?? f.def ?? '');
    let input;
    if (f.type === 'select') input = `<select id="f_${f.k}">${f.options.map(o => `<option${o === (data[f.k] ?? f.def) ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea id="f_${f.k}" placeholder="${esc(f.ph || '')}">${v}</textarea>`;
    else if (f.type === 'checks') input = `<div class="checks">${f.options.map(o => `<label><input type="checkbox" name="f_${f.k}" value="${esc(o)}"${(data[f.k] || []).includes(o) ? ' checked' : ''}>${esc(o)}</label>`).join('')}</div>`;
    else input = `<input id="f_${f.k}" type="${f.type || 'text'}" value="${v}" placeholder="${esc(f.ph || '')}"${f.type === 'number' ? ' inputmode="numeric"' : ''}>`;
    return `<div class="${f.full ? 'full' : ''}"><label>${esc(f.label)}</label>${input}</div>`;
  }).join('') + '</div>';
}
function readForm(fields) {
  const o = {};
  fields.forEach(f => {
    if (f.type === 'checks') o[f.k] = [...document.querySelectorAll(`[name="f_${f.k}"]:checked`)].map(x => x.value);
    else o[f.k] = $('f_' + f.k).value.trim();
  });
  return o;
}

/* ───────── 고객 종류 공통 (c = 개인, ceo = 법인, p = 가망) ───────── */
const findPerson = (kind, id) => ({c: db.customers, ceo: db.ceos, p: db.prospects})[kind].find(x => x.id === id);
const SHOW = {c: id => showCustomer(id), ceo: id => showCeo(id), p: id => showProspect(id)};
const personName = (kind, p) => kind === 'ceo' ? p.company : p.name;
function personItem(kind, p, meta, right) {
  const avatar = kind === 'ceo' ? '🏢' : kind === 'p' ? '🌱' : esc(p.name.slice(0, 1));
  return `<li class="item" onclick="SHOW['${kind}']('${p.id}')"><div class="avatar">${avatar}</div>
    <div class="body"><div class="name">${esc(personName(kind, p))}</div><div class="meta">${meta}</div></div>${right || ''}</li>`;
}
// ⭐ 관심고객 표시
let starOnly = {c: false, ceo: false};
const starBtn = (kind, p) => `<button class="star${p.star ? ' on' : ''}" onclick="event.stopPropagation();toggleStar('${kind}','${p.id}')" aria-label="관심고객 표시">★</button>`;
function toggleStar(kind, id, reopen) {
  const p = findPerson(kind, id); p.star = !p.star;
  save(); refresh(); toast(p.star ? '⭐ 관심고객으로 표시했습니다.' : '관심고객 표시를 뺐습니다.');
  if (reopen) SHOW[kind](id);
}

function todoItems() {
  const t = today(), items = [];
  const add = (p, kind) => {
    if (p.next && p.next <= t) items.push({p, kind, tag: p.next < t ? `<span class="tag overdue">${dayDiff(p.next, t)}일 지남</span>` : '<span class="tag today">오늘 연락</span>', sort: p.next});
  };
  db.customers.forEach(c => add(c, 'c'));
  db.ceos.forEach(c => add(c, 'ceo'));
  db.prospects.forEach(c => add(c, 'p'));
  db.customers.forEach(c => {
    const d = daysToBirthday(c.birth);
    if (d !== null && d <= 7) items.push({p: c, kind: 'c', tag: `<span class="tag bday">🎂 ${d === 0 ? '오늘 생일' : d + '일 후 생일'}</span>`, sort: 'b' + pad(d)});
  });
  return items.sort((a, b) => a.sort.localeCompare(b.sort));
}
function monthStats(m) {
  const inM = d => (d || '').startsWith(m);
  const people = [...db.customers, ...db.ceos];
  const perf = db.perf.filter(p => inM(p.date));
  return {
    newCust: people.filter(p => inM(p.created)).length,
    consult: people.reduce((n, p) => n + (p.logs || []).filter(l => inM(l.date)).length, 0),
    contract: perf.length,
    premium: perf.reduce((n, p) => n + (Number(p.premium) || 0), 0),
  };
}

const DAY_OPTIONS = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];
const BYDAY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];

const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const routineText = r => r.text.replace(/\{이름\}/g, db.settings.fcName);
// 가장 최근에 보냈어야 할 날 (오늘 포함)
function lastDue(r) {
  const d = new Date(); d.setDate(d.getDate() - (d.getDay() - r.day + 7) % 7); return ymd(d);
}
// 다음에 보낼 날 (오늘 시간이 아직 안 지났으면 오늘)
function nextDue(r) {
  const d = new Date(), diff = (r.day - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + (diff === 0 && nowHM() > r.time ? 7 : diff)); return ymd(d);
}
function renderRoutines() {
  const t = today();
  const items = db.routines.map(r => {
    const date = lastDue(r), done = !!db.routineLog[r.id + '|' + date], isToday = date === t;
    return {r, date, done, isToday};
  }).filter(x => x.isToday || !x.done);
  const rows = items.map(({r, date, done, isToday}) => {
    const tag = done ? '<span class="tag done">✓ 보냈어요</span>'
      : !isToday ? `<span class="tag overdue">지난 ${DAYS[r.day]}요일 못 보냄</span>`
      : nowHM() >= r.time ? `<span class="tag overdue">⏰ ${r.time} 보낼 시간!</span>` : `<span class="tag today">오늘 ${r.time}</span>`;
    return `<div class="routine"><div class="row"><b class="grow">${esc(r.title)}</b>${tag}</div>
      <div class="row" style="margin-top:8px">
        <button class="btn sec sm grow" onclick="copyText(routineText(db.routines.find(x => x.id === '${r.id}')))">📋 문구 복사</button>
        <button class="btn sm grow${done ? ' sec' : ''}" onclick="markRoutine('${r.id}','${date}')">${done ? '보냄 취소' : '✓ 보냈어요'}</button>
        <button class="btn sec sm" onclick="editRoutine('${r.id}')">문구 수정</button></div></div>`;
  }).join('');
  const upcoming = [...db.routines].sort((a, b) => (nextDue(a) + a.time).localeCompare(nextDue(b) + b.time))[0];
  $('routineCard').innerHTML = `<div class="row" style="margin-bottom:4px"><h3 class="grow" style="margin:0">📅 정기 문자</h3><button class="btn sec sm" onclick="manageRoutines()">관리 · 알람</button></div>
    ${rows || `<div class="muted" style="padding:8px 0">오늘 보낼 정기 문자가 없습니다.${upcoming ? ` 다음: ${DAYS[upcoming.day]}요일 ${upcoming.time} ${esc(upcoming.title)}` : ''}</div>`}`;
}
function markRoutine(id, date) {
  const k = id + '|' + date;

  save(); renderRoutines(); if (db.routineLog[k]) toast('수고하셨어요! 👍');

function manageRoutines() {

    ${db.routines.map(r => `<div class="card"><div class="row"><b class="grow">${esc(r.title)}</b><span class="tag">매주 ${DAYS[r.day]}요일 ${r.time}</span></div>

        <a class="btn sm grow" style="text-align:center;text-decoration:none;line-height:22px" href="${gcalUrl(r)}" target="_blank" rel="noopener">📅 구글 캘린더에 알람 등록</a>
        <button class="btn sec sm" onclick="editRoutine('${r.id}')">수정</button></div></div>`).join('') || '<div class="empty">정기 문자가 없습니다.</div>'}
    <div class="row" style="margin-bottom:12px">

    · <b>삼성 캘린더·아이폰</b>: "캘린더 파일 받기"를 누른 뒤 받은 파일을 열면 캘린더에 추가됩니다(모든 정기 문자가 한 번에 등록됩니다).<br>

const ROUTINE_FIELDS = [

];

function removeRoutine(id) {
  if (!confirm('이 정기 문자를 삭제할까요? (캘린더에 등록한 알람은 캘린더에서 따로 지워 주세요)')) return;
  db.routines = db.routines.filter(x => x.id !== id);
  save(); refresh(); manageRoutines();
}
// 캘린더 일정 시간 (YYYYMMDDTHHMMSS), 10분짜리 일정
function calTimes(r) {
  const start = new Date(nextDue(r) + 'T' + r.time + ':00'), end = new Date(start.getTime() + 10 * 60000);
  const f = d => ymd(d).replace(/-/g, '') + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
  return [f(start), f(end)];
}
const appUrl = () => location.href.split('#')[0];
function gcalUrl(r) {
  const [s, e] = calTimes(r);
  return 'https://calendar.google.com/calendar/render?' + new URLSearchParams({
    action: 'TEMPLATE', text: `📩 ${r.title} 보내기`, dates: `${s}/${e}`, ctz: 'Asia/Seoul',
    recur: `RRULE:FREQ=WEEKLY;BYDAY=${BYDAY[r.day]}`,
    details: `영업비서 앱을 열어 문구를 복사해서 보내세요.\n${appUrl()}`,
  });
}
function downloadIcs() {
  const icsEsc = t => String(t).replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//hmsfc//sales-assistant//KO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VTIMEZONE', 'TZID:Asia/Seoul', 'BEGIN:STANDARD', 'DTSTART:19700101T000000', 'TZOFFSETFROM:+0900', 'TZOFFSETTO:+0900', 'TZNAME:KST', 'END:STANDARD', 'END:VTIMEZONE'];
  db.routines.forEach(r => {
    const [s, e] = calTimes(r);
    lines.push('BEGIN:VEVENT', `UID:${r.id}@hmsfc`, `DTSTAMP:${stamp}`, `DTSTART;TZID=Asia/Seoul:${s}`, `DTEND;TZID=Asia/Seoul:${e}`,
      `RRULE:FREQ=WEEKLY;BYDAY=${BYDAY[r.day]}`, `SUMMARY:${icsEsc('📩 ' + r.title + ' 보내기')}`,
      `DESCRIPTION:${icsEsc('영업비서 앱을 열어 문구를 복사해서 보내세요.\n' + appUrl())}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(r.title + ' 보낼 시간입니다')}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], {type: 'text/calendar;charset=utf-8'}));
  a.download = '정기문자_알람.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('파일을 받았습니다. 열어서 캘린더에 추가하세요.');
}

function goalBars(m, onGoalsPage) {
  const g = db.goals[m] || {}, s = monthStats(m);
  const rows = GOAL_FIELDS.filter(f => Number(g[f.k]) > 0);
  if (!rows.length) return `<div class="empty">아직 목표가 없습니다.${onGoalsPage ? ' 오른쪽(아래)에서 설정하세요.' : ' <a href="#goals">목표 설정하기</a>'}</div>`;
  return rows.map(f => {
    const goal = Number(g[f.k]), cur = s[f.k], pct = Math.min(100, Math.round(cur / goal * 100));
    const fmt = f.k === 'premium' ? won : n => n;
    return `<div class="progress"><div class="lbl"><span>${f.label.replace(/ \(.*\)/, '')}</span><span><b>${fmt(cur)}</b> / ${fmt(goal)} (${pct}%)</span></div>
      <div class="bar"><i class="${pct >= 100 ? 'done' : ''}" style="width:${pct}%"></i></div></div>`;
  }).join('');
}

function editPerf(id) {
  const p = db.perf.find(x => x.id === id) || {date: today()};
  openSheet(id ? '실적 수정' : '실적 입력', formHtml(PERF_FIELDS, p) + `<div class="row" style="margin-top:14px">
    <button class="btn grow" onclick="savePerf('${id || ''}')">저장</button>
    ${id ? `<button class="btn danger" onclick="removeItem('perf','${id}')">삭제</button>` : ''}</div>`);
}
function savePerf(id) {
  const v = readForm(PERF_FIELDS);
  if (!v.date || !v.name) return alert('계약일과 고객명을 입력해 주세요.');
  v.premium = Number(v.premium) || 0;
  const p = db.perf.find(x => x.id === id);
  if (p) Object.assign(p, v); else db.perf.push({id: uid(), ...v});
  save(); closeSheet(); refresh(); toast('실적을 저장했습니다.');
}

/* ───────── 설정 · 백업 ───────── */
function openSettings() {
  openSheet('설정', `
    <div class="card"><h3>내 이름</h3>
      <div class="row"><input id="setName" class="grow" value="${esc(db.settings.fcName)}" style="flex:1"><button class="btn" onclick="db.settings.fcName=$('setName').value.trim()||'현미숙 FC';save();refresh();toast('저장했습니다.')">저장</button></div>
      <p class="muted">상담 문구의 서명에 사용됩니다.</p></div>
    <div class="card"><h3>💾 백업</h3>
      <p class="muted" style="margin-top:0">데이터는 이 기기의 이 브라우저 안에만 저장됩니다. 브라우저 기록을 지우거나 기기를 바꾸면 사라지니, 정기적으로 백업 파일을 내보내 안전한 곳에 보관하세요. 다른 기기로 옮길 때도 이 파일을 불러오면 됩니다.</p>
      <p class="muted">마지막 백업: ${db.settings.lastBackup || '없음'}</p>
      <div class="row"><button class="btn grow" onclick="exportData()">백업 파일 내보내기</button><button class="btn sec grow" onclick="$('importFile').click()">백업 불러오기</button></div></div>
    <div class="card"><h3>🔒 개인정보 안내</h3>
      <p class="muted" style="margin:0">고객 정보는 서버로 전송되지 않습니다. 다만 휴대폰 분실에 대비해 화면 잠금을 꼭 사용하시고, 백업 파일은 카톡·메일 등으로 공유하지 마세요. 실제 업무 사용 전 회사의 개인정보·보안 규정을 확인하세요.</p></div>
    <div class="card"><h3>📅 정기 문자 · 알람</h3><p class="muted" style="margin-top:0">매주 보내는 인사·상식 문자와 알람을 관리합니다.</p><button class="btn sec" onclick="manageRoutines()">정기 문자 관리</button></div>
    <div class="card"><h3>초기화</h3><button class="btn danger" onclick="resetAll()">모든 데이터 삭제</button></div>`);
}
function exportData() {
  db.settings.lastBackup = today(); save();
  const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `영업비서_백업_${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('백업 파일을 내보냈습니다.'); refresh();
  if ($('sheetBg').classList.contains('open') && $('sheetTitle').textContent === '설정') openSettings();
}
function importData(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.customers) || !Array.isArray(d.ceos) || !Array.isArray(d.perf) || (d.prospects && !Array.isArray(d.prospects))) throw 0;
      if (!confirm(`백업 파일을 불러올까요?\n고객 ${d.customers.length}명, 가망고객 ${(d.prospects || []).length}명, CEO ${d.ceos.length}곳, 실적 ${d.perf.length}건\n※ 지금 기기의 데이터는 백업 내용으로 바뀝니다.`)) return;
      const base = defaults();
      db = {...base, ...d, settings: {...base.settings, ...d.settings}};
      save(); closeSheet(); refresh(); toast('백업을 불러왔습니다.');
    } catch (e) { alert('올바른 백업 파일이 아닙니다.'); }
  };
  r.readAsText(file);
}
function resetAll() {
  if (!confirm('모든 고객·실적·목표 데이터를 삭제합니다. 계속할까요?')) return;
  if (!confirm('정말 삭제할까요? 백업 파일이 없으면 되돌릴 수 없습니다.')) return;
  db = defaults(); save(); closeSheet(); refresh(); toast('초기화했습니다.');
}

/* ───────── 시작 ───────── */
showPage(location.hash.slice(1) || 'home');

// 앱 설치·오프라인 지원 (https 주소에서만 동작, 파일을 직접 열면 건너뜀)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
