<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연락처 가져오기</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f5f7fa;color:#102a43;padding:24px 16px;text-align:center}
  h1{font-size:22px;margin:8px 0 6px}
  p{color:#52606d;font-size:15px;line-height:1.5;margin:6px 0}
  .big{display:block;width:100%;max-width:420px;margin:22px auto 10px;padding:22px 10px;font-size:22px;font-weight:700;border:0;border-radius:18px;background:#102a43;color:#fff}
  .sec{display:block;width:100%;max-width:420px;margin:10px auto;padding:14px 10px;font-size:17px;border:1px solid #cbd2d9;border-radius:14px;background:#fff;color:#102a43}
  ul{list-style:none;padding:0;max-width:420px;margin:12px auto;text-align:left}
  li{background:#fff;border:1px solid #e4e7eb;border-radius:12px;padding:10px 14px;margin:6px 0;font-size:16px}
  .ok{color:#0f7b3f;font-weight:700}
  .err{color:#b42318;font-weight:700}
</style>
</head>
<body>
  <h1>📱 연락처 가져오기</h1>
  <p id="info">아래 버튼을 누르고 사람 이름을 눌러 ✓ 표시한 뒤 [완료]를 누르세요.<br>여러 명 골라도 돼요.</p>
  <button class="big" id="pick">연락처에서 고르기</button>
  <button class="sec" id="pick1">안 되면 👉 한 명씩 고르기 (다른 방식)</button>
  <ul id="list"></ul>
  <p id="msg"></p>
  <button class="sec" id="back" style="display:none">✅ 앱으로 돌아가기</button>
<script>
// 영업비서 앱(설치한 앱)에서 연락처 창이 바로 닫히는 기기를 위해, 크롬에서 고르고
// 고른 사람을 'hmsPicked'에 넣어 두면 앱으로 돌아갔을 때 앱이 가져갑니다. (같은 주소라 저장 공간을 같이 씀)
const to = new URLSearchParams(location.search).get('to') || 'dbleads';
const LABEL = {customers: '고객', dbleads: '관심고객', prospects: '가망고객', contracted: '기계약자'}[to] || '관심고객';
document.title = LABEL + '에 연락처 가져오기';
const fmt = t => {
  let d = String(t || '').trim().replace(/^\+82[\s-]*/, '0').replace(/\D/g, '');
  if (d.length === 10 && d.startsWith('1')) d = '0' + d;
  if (d.startsWith('02')) return d.length === 9 ? `${d.slice(0, 2)}-${d.slice(2, 5)}-${d.slice(5)}` : d.length === 10 ? `${d.slice(0, 2)}-${d.slice(2, 6)}-${d.slice(6)}` : d;
  return d.length === 11 ? `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}` : d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}` : d;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const $ = id => document.getElementById(id);
let pickMode = {multiple: true};
$('pick1').onclick = () => { pickMode = {multiple: false}; pickNow(); };
$('pick').onclick = () => { pickMode = {multiple: true}; pickNow(); };
async function pickNow() {
  if (!('contacts' in navigator && 'ContactsManager' in window)) {
    $('msg').innerHTML = '<span class="err">이 브라우저에서는 연락처를 고를 수 없어요.<br>크롬(Chrome)에서 열어 주세요.</span>'; return;
  }
  let list = [];
  try { list = await navigator.contacts.select(['name', 'tel'], pickMode) || []; }
  catch (e) { $('msg').innerHTML = `<span class="err">연락처 창을 열지 못했어요. (${esc(e.name || '')})</span>`; return; }
  const items = list.map(c => ({nm: String((c.name || []).find(Boolean) || '').trim(), tel: fmt((c.tel || []).find(Boolean))})).filter(x => x.nm || x.tel);
  if (!list.length) { $('msg').innerHTML = '<span class="err">휴대폰이 0명을 넘겨줬어요.</span><br>이름을 눌러 ✓ 표시한 뒤 오른쪽 위 [완료]를 눌러 주세요.' + browserLine(); return; }
  if (!items.length) {
    // 사람은 넘어왔는데 이름·번호가 비어 있음 → 연락처 창 위 [이름] [전화번호] 버튼이 꺼져 있거나 크롬 연락처 권한 문제
    $('msg').innerHTML = `<span class="err">${list.length}명을 받았는데 이름·번호가 비어 있어요.</span><br>
      연락처 창 맨 위의 <b>[이름] [전화번호]</b> 버튼을 눌러 <b>둘 다 켜진(색칠된) 상태</b>로 한 뒤 다시 골라 주세요.<br>
      <small style="color:#9aa5b1">받은 내용: ${esc(JSON.stringify(list.slice(0, 2)))}</small>`;
    return;
  }
  let box = []; try { box = JSON.parse(localStorage.getItem('hmsPicked') || '[]'); } catch (e) {}
  box.push({to, items, t: Date.now()});
  localStorage.setItem('hmsPicked', JSON.stringify(box));
  $('list').innerHTML = items.map(x => `<li>👤 <b>${esc(x.nm || '(이름 없음)')}</b> · ${esc(x.tel || '(번호 없음)')}</li>`).join('');
  $('msg').innerHTML = `<span class="ok">${items.length}명을 담았어요. 앱으로 돌아가면 ${LABEL}에 들어가 있어요.</span>`;
  $('pick').textContent = '더 고르기';
  $('back').style.display = '';
  setTimeout(goBack, 1200);
}
// 어떤 브라우저인지 (삼성 인터넷은 연락처를 못 넘겨주는 경우가 있음)
function browserLine() {
  const ua = navigator.userAgent, m = ua.match(/SamsungBrowser\/([\d.]+)/), c = ua.match(/Chrome\/([\d.]+)/);
  const name = m ? '삼성 인터넷 ' + m[1] : c ? '크롬 ' + c[1] : '기타 브라우저';
  return `<br><br><small style="color:#7b8794">지금 브라우저: <b>${esc(name)}</b>${/Mobile/.test(ua) ? ' · 휴대폰' : ' · 태블릿'}</small>` +
    (m ? '<br><span class="err">삼성 인터넷에서는 연락처가 안 넘어와요. 크롬(Chrome)에서 해 주세요.</span>' : '');
}
function goBack() {
  window.close(); // 앱에서 열린 창이면 닫히면서 앱으로 돌아감
  setTimeout(() => { $('msg').innerHTML += '<br>창이 안 닫히면 휴대폰의 [뒤로] 버튼을 누르거나 앱을 다시 열어 주세요.'; }, 600);
}
$('back').onclick = goBack;
</script>
</body>
</html>
