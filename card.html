<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>삼성생명 FC 현미숙 · HMS 디지털 명함</title>
<!-- 카톡·문자에 링크를 붙이면 보이는 미리보기 (카카오 키가 없을 때) -->
<meta property="og:type" content="profile">
<meta property="og:title" content="삼성생명 FC 현미숙 · HMS 디지털 명함">
<meta property="og:description" content="명함을 확인하세요. 보험 상담 30년 · 개인사업자·자영업자·CEO 전문">
<meta property="og:image" content="https://hms36903690.github.io/ai-assistant/card-og.png">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="420">
<style>
  :root{--g:#0d3b2e;--g2:#14523f;--gold:#b89b5e;--gold2:#d4b46a;--ink:#1f2933;--sub:#616e7c;--line:#d9dee3;--bg:#f6f5f0}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
  .top{background:linear-gradient(160deg,var(--g),var(--g2));color:#f3ead2;border-radius:22px;padding:26px 20px 22px;text-align:center;border:1px solid var(--gold);position:relative}
  .brand{font-size:11px;letter-spacing:4px;color:var(--gold2);font-weight:800}
  .photo{width:132px;height:132px;border-radius:50%;object-fit:cover;border:3px solid var(--gold2);margin:14px auto 8px;display:block;background:#0b3026}
  .ph-empty{width:132px;height:132px;border-radius:50%;border:3px solid var(--gold2);margin:14px auto 8px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--gold2);background:#0b3026}
  h1{margin:4px 0 0;font-size:26px}
  .title{font-size:14px;opacity:.9}
  .intro{margin:10px 0 0;font-size:15px}
  .badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
  .badges span{font-size:12px;border:1px solid rgba(212,180,106,.7);border-radius:999px;padding:3px 10px}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .b{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .b span{font-size:22px}
  .kakao{background:#fee500;border-color:#fee500;color:#191600}
  .cta{display:block;text-align:center;margin-top:12px;padding:15px;border-radius:999px;background:var(--g);color:#f3ead2;text-decoration:none;font-weight:900;font-size:17px;border:1px solid var(--gold)}
  .card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:16px;padding:16px 18px;margin-top:14px}
  .card h2{font-size:17px;margin:0 0 8px}
  .card ul{margin:0;padding-left:18px}
  .card li{margin:3px 0}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #eef0f2;font-size:15px}
  .row:first-of-type{border-top:0}
  .row small{color:var(--sub)}
  .row a{color:var(--g);font-weight:700;text-decoration:none;text-align:right;word-break:break-all}
  .muted{color:var(--sub);font-size:12px;text-align:center;margin-top:16px}
  .err{text-align:center;padding:40px 10px;color:var(--sub)}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qb{display:flex;align-items:center;justify-content:center;padding:15px 6px;border-radius:14px;font:inherit;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer;border:0;background:#eef3f8;color:#13294b}
  .qb.dark{background:var(--g);color:#f3ead2}
  .qb.kakao{background:#fee500;color:#191600}
  .qb.beige{background:#f4ecdd;color:#6b4f12}
  .fm label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
  .fm input,.fm select,.fm textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);box-sizing:border-box}
  .fm textarea{min-height:90px;resize:vertical}
  .fm .chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:700;margin-top:14px}
  .fm .chk input{width:20px;height:20px;flex:none;accent-color:var(--g)}
  .fm .agree{background:#f8f7f2;border:1px solid #e8e1cc;border-radius:12px;padding:10px 12px;font-size:12px;color:#5c4a1f;margin-top:10px;line-height:1.6}
  .fm .send{width:100%;margin-top:14px;padding:15px;border-radius:14px;border:0;background:var(--g);color:#f3ead2;font:inherit;font-size:17px;font-weight:900;cursor:pointer}
  .fm .msg{color:#b42318;font-size:14px;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">명함을 불러오고 있어요…</div></div>
<script>
// 디지털 명함: card.html?u=(계정 번호) → Firebase 공개 칸(hmsfc_pub)의 명함 내용을 보여 줌
//              card.html#d=(내용) → 링크 안에 담긴 내용으로 보여 줌 (사진 없음, 예비)
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
// 명함 불러오기: ① ?u= 가 있으면 Firebase 공개 칸(사진 포함)에서 ② 안 되면 링크 안에 담긴 #d= 내용(사진 제외)으로 — 둘 중 하나라도 되면 열림
let loadErr = '';
const fromHash = () => {
  const h = new URLSearchParams(location.hash.slice(1)).get('d');
  if (!h) return null;
  try { return JSON.parse(decodeURIComponent(escape(atob(h.replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { loadErr += ' 링크 내용 오류'; return null; }
};
async function load() {
  const P = new URLSearchParams(location.search), U = (P.get('u') || '').replace(/[^A-Za-z0-9]/g, '');
  if (U) {
    try {
      const cfg = await (await fetch('sync-config.json', {cache: 'no-cache'})).json();
      const r = await fetch(`https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/hmsfc_pub/${U}?key=${cfg.apiKey}`);
      if (r.ok) { const f = (await r.json()).fields || {}, c = f.card && f.card.stringValue; if (c) return JSON.parse(c); loadErr = '명함 내용 없음'; }
      else loadErr = '서버 ' + r.status;
    } catch (e) { loadErr = '연결 ' + (e.message || e); }
  }
  return fromHash();
}
function render(c) {
  document.title = `${c.name || ''} · HMS 디지털 명함`;
  const tel = String(c.phone || '').replace(/[^\d+]/g, ''), apply = safeUrl(c.apply), kakao = safeUrl(c.kakao), home = safeUrl(c.homepage);
  const pts = String(c.points || '').split('\n').map(x => x.trim()).filter(Boolean);
  const badges = String(c.badges || '').split(',').map(x => x.trim()).filter(Boolean);
  $('app').innerHTML = `
  <div class="top"><div class="brand">HMS 디지털 명함</div>
    ${c.photo && /^data:image\/(jpeg|png|webp);base64,/.test(c.photo) ? `<img class="photo" src="${c.photo}" alt="${esc(c.name)} 사진">` : `<div class="ph-empty">${esc((c.name || 'FC').slice(0, 3))}</div>`}
    <h1>${esc(c.name)}</h1><div class="title">${esc([c.org, c.title].filter(Boolean).join(' · '))}</div>
    ${c.intro ? `<p class="intro">${esc(c.intro)}</p>` : ''}
    ${badges.length ? `<div class="badges">${badges.map(b => `<span>${esc(b)}</span>`).join('')}</div>` : ''}
  </div>
  <div class="card"><h2>빠른 상담 연결</h2>
    <div class="quick">
      ${tel ? `<a class="qb dark" href="tel:${tel}">📞 전화 상담</a><a class="qb" href="sms:${tel}">💬 문자 보내기</a>` : ''}
      ${kakao ? `<a class="qb beige" href="${esc(kakao)}" target="_blank" rel="noopener">🗨️ 카카오톡 상담</a>` : ''}
      <button class="qb${c.kakaoKey ? ' kakao' : ''}" id="shareBtn">🔗 명함 공유하기</button>
    </div>
    <button class="qb" id="saveBtn" style="width:100%;margin-top:10px">📇 내 휴대폰에 연락처 저장</button>
  </div>
  ${applyInfo(c.apply) ? `<div class="card fm" id="formCard"><h2 id="fmTitle">상담 신청</h2>
    <label for="fNm">성함</label><input id="fNm" placeholder="성함을 입력해 주세요" autocomplete="name">
    <label for="fPh">연락처</label><input id="fPh" type="tel" inputmode="tel" placeholder="010-0000-0000" autocomplete="tel">
    <label for="fTopic">상담 분야</label><select id="fTopic"><option>일반 보험 상담</option><option>기존 보험 점검 (보장분석)</option><option>사업장 화재·배상책임</option><option>대표님 건강·소득 보장</option><option>암·실손 보장</option><option>연금·노후 준비</option><option>법인·CEO 컨설팅</option><option>기타</option></select>
    <label for="fQ">문의 내용 (선택)</label><textarea id="fQ" placeholder="상담받고 싶은 내용을 간단히 적어 주세요. 주민등록번호·계좌번호·질병 상세정보 등 민감정보는 입력하지 마세요."></textarea>
    <label class="chk"><input type="checkbox" id="fAg"> <span>상담 연락을 위한 개인정보 수집·이용에 동의합니다.</span></label>
    <div class="agree">수집 항목: 성함·연락처·상담 분야·문의 내용 / 목적: 상담 신청 확인과 회신 / 보유 기간: 상담 종료 후 1년(또는 동의 철회 시까지) 후 파기 / 동의하지 않으셔도 되지만, 그러면 신청이 접수되지 않아요. 보험증권·진료기록 같은 민감한 자료는 이 양식으로 보내지 마세요.</div>
    <div class="msg" id="fMsg"></div>
    <button class="send" id="fSend">상담 신청 보내기</button>
    <button class="qb beige" id="fBojang" style="width:100%;margin-top:8px">📋 무료 보장분석 신청으로 바꾸기</button>
  </div>` : ''}
  ${pts.length || home ? `<div class="card"><h2>${esc(c.name || '')} FC 소개</h2>${pts.length ? `<ul>${pts.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
    ${home ? `<a class="b" href="${esc(home)}" target="_blank" rel="noopener" style="flex-direction:row;justify-content:center;gap:6px;margin-top:12px;background:#eef3ef">📝 블로그 보기</a>` : ''}</div>` : ''}
  <div class="card" style="text-align:center"><h2>📱 QR로 명함 주고받기</h2>
    <div id="qrBox" style="display:flex;justify-content:center;margin:6px 0"></div>
    <p style="margin:4px 0 0;font-size:13px;color:var(--sub)">만난 자리에서 이 QR을 찍으면 바로 명함이 열려요.</p></div>
  <p class="muted">${esc(c.org || '')} ${esc(c.name || '')}${c.office ? ` · 고객센터 <a href="tel:${esc(String(c.office).replace(/[^\d+]/g, ''))}" style="color:inherit">${esc(c.office)}</a>` : ''}${c.reviewNo ? '<br>' + esc(c.reviewNo) : ''}<br>보험 가입 전 상품설명서와 약관을 꼭 읽어 보세요.</p>`;
  $('saveBtn').onclick = () => {
    const v = ['BEGIN:VCARD', 'VERSION:3.0', `FN:${c.name || ''}`, `N:${c.name || ''};;;;`, c.org && `ORG:${c.org}`, c.title && `TITLE:${c.title}`,
      tel && `TEL;TYPE=CELL:${c.phone}`, c.office && `TEL;TYPE=WORK:${c.office}`, c.email && `EMAIL:${c.email}`, c.address && `ADR;TYPE=WORK:;;${c.address};;;;`,
      'END:VCARD'].filter(Boolean).join('\r\n');
    const fileSave = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([v], {type: 'text/vcard'})); a.download = `${c.name || 'contact'}.vcf`; a.click(); };
    // 안드로이드: 휴대폰 '새 연락처' 화면을 이름·번호가 채워진 채로 바로 엶 (파일 내려받기는 카톡 안 화면 등에서 안 되는 경우가 많음)
    if (/Android/i.test(navigator.userAgent)) {
      const x = (k, val) => val ? `S.${k}=${encodeURIComponent(val)};` : '';
      location.href = 'intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/raw_contact;' +
        x('name', c.name) + x('phone', c.phone) + x('secondary_phone', c.office) + x('email', c.email) + x('company', c.org) + x('job_title', c.title) + x('postal', c.address) + 'end'; // (메모에 명함 주소 넣던 것은 빼달라는 요청으로 지움)
      setTimeout(() => { if (!document.hidden) { fileSave(); alert('연락처 화면이 안 열리면, 내려받은 연락처 파일(.vcf)을 열어 저장해 주세요.\n카톡 안에서 안 되면 오른쪽 위 ⋮ → [다른 브라우저로 열기] 후 다시 눌러 주세요.'); } }, 1800);
      return;
    }
    fileSave(); // 아이폰·컴퓨터: 연락처 파일 → 열면 '연락처에 추가'
  };
  kakaoPreload(c); setupForm(c);
  const qs = document.createElement('script'); qs.src = 'qrcode.js';
  qs.onload = () => { try { const q = qrcode(0, 'M'); q.addData(/[?&]u=/.test(location.search) ? location.href.split('#')[0] : location.href); q.make(); $('qrBox').innerHTML = `<img src="${q.createDataURL(5, 2)}" alt="명함 QR" style="width:180px;height:180px;image-rendering:pixelated">`; } catch (e) { $('qrBox').closest('.card').remove(); } };
  qs.onerror = () => $('qrBox').closest('.card').remove();
  document.head.appendChild(qs);
  $('shareBtn').onclick = async () => {
    // 카카오 키가 있으면 카톡 친구 고르는 화면으로 바로 (사진·이름·직함·[명함 확인] 카드)
    if (c.kakaoKey) { try { return kakaoShare(c); } catch (e) {} } // 기다리지 않고 바로 (누른 순간에 보내야 함)
    const data = {title: `${c.name} 명함`, text: `${c.org || ''} ${c.name || ''} 디지털 명함입니다.`, url: location.href};
    try { if (navigator.share) return await navigator.share(data); await navigator.clipboard.writeText(location.href); alert('명함 주소를 복사했어요.'); } catch (e) {}
  };
}
// 카카오 프로그램은 명함이 열릴 때 미리 불러 둠 → 버튼을 누르는 순간 바로 보내야 휴대폰이 막지 않음
let kakaoOn = false;
// 명함 안 상담 신청서: 명함의 apply 주소(u=계정, to=FC 번호, ch=유입)를 그대로 써서 상담 신청 페이지와 같은 방식으로 접수
function applyInfo(a) {
  try { const u = new URL(a), P = u.searchParams; return {U: (P.get('u') || '').replace(/[^A-Za-z0-9]/g, ''), to: (P.get('to') || '').replace(/\D/g, ''), ch: (P.get('ch') || '디지털 명함').slice(0, 20)}; }
  catch (e) { return null; }
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function saveOnline(U, o) {
  const cfg = await (await fetch('sync-config.json', {cache: 'no-cache'})).json();
  const base = `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents`;
  const pr = await fetch(`${base}/hmsfc_pub/${U}?key=${cfg.apiKey}`); if (!pr.ok) throw new Error('pub ' + pr.status);
  const pk = (await pr.json()).fields.pk.stringValue;
  const pub = await crypto.subtle.importKey('spki', Uint8Array.from(atob(pk), ch => ch.charCodeAt(0)), {name: 'RSA-OAEP', hash: 'SHA-256'}, false, ['encrypt']);
  const aes = await crypto.subtle.generateKey({name: 'AES-GCM', length: 256}, true, ['encrypt']), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, aes, new TextEncoder().encode(JSON.stringify(o)));
  const ek = await crypto.subtle.encrypt({name: 'RSA-OAEP'}, pub, await crypto.subtle.exportKey('raw', aes));
  const r = await fetch(`${base}/hmsfc_in/${U}/leads?key=${cfg.apiKey}`, {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({fields: {ek: {stringValue: b64(ek)}, iv: {stringValue: b64(iv)}, ct: {stringValue: b64(ct)}, v: {integerValue: '1'}, at: {integerValue: String(Date.now())}}})});
  if (!r.ok) throw new Error('save ' + r.status);
}
function setupForm(c) {
  const A = applyInfo(c.apply); if (!A || !$('fSend')) return;
  const fmt = v => { const d = String(v).replace(/\D/g, '').slice(0, 11); return d.length === 11 ? `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}` : d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}` : d; };
  $('fBojang').onclick = () => { $('fTopic').value = '기존 보험 점검 (보장분석)'; $('fmTitle').textContent = '무료 보장분석 신청'; $('fQ').placeholder = '지금 가입하신 보험(회사·상품 이름 정도)이나 궁금한 점을 적어 주세요. 주민등록번호·계좌번호·병명 같은 민감정보는 적지 마세요.'; $('fBojang').style.display = 'none'; $('fNm').focus(); };
  $('fSend').onclick = async () => {
    const nm = $('fNm').value.trim(), ph = fmt($('fPh').value);
    if (!nm) return $('fMsg').textContent = '성함을 입력해 주세요.';
    if (!/^0\d{1,2}-\d{3,4}-\d{4}$/.test(ph)) return $('fMsg').textContent = '연락처를 정확히 입력해 주세요. (예: 010-1234-5678)';
    if (!$('fAg').checked) return $('fMsg').textContent = '개인정보 수집·이용에 동의해 주셔야 접수돼요.';
    $('fMsg').textContent = '';
    const d = new Date(), day = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const topic = $('fTopic').value, o = {name: nm, phone: ph, topic, q: $('fQ').value.trim().slice(0, 300), ch: A.ch + (/보장분석/.test(topic) ? '·보장분석' : ''), agree: `동의 (${day})`, ad: '미동의', day};
    $('fSend').disabled = true; $('fSend').textContent = '접수하고 있어요…';
    const done = html => { $('formCard').innerHTML = `<div style="text-align:center"><h2>${html}</h2><p style="color:var(--sub)">말씀하신 내용 확인하고 ${esc(c.name || '')} FC가 직접 연락드릴게요. 감사합니다!</p></div>`; };
    if (A.U) { try { await saveOnline(A.U, o); return done('✅ 상담 신청이 접수됐어요'); } catch (e) {} }
    if (/^01\d{8,9}$/.test(A.to)) {
      const body = ['[상담신청]', `성함: ${o.name}`, `연락처: ${o.phone}`, `상담: ${o.topic}`, o.q && `문의: ${o.q.slice(0, 200)}`, `유입: ${o.ch}`, `개인정보 수집·이용 동의: ${o.agree}`, `광고성 정보 수신: ${o.ad}`].filter(Boolean).join('\n');
      location.href = `sms:${A.to}?&body=${encodeURIComponent(body)}`;
      return done('📩 문자 앱에서 [보내기]를 눌러 주세요');
    }
    $('fSend').disabled = false; $('fSend').textContent = '상담 신청 보내기'; $('fMsg').textContent = '지금 접수가 잘 안 돼요. 위의 전화·문자로 연락 주세요.';
  };
}
function kakaoPreload(c) {
  if (!c.kakaoKey) return;
  const sc = document.createElement('script'); sc.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js'; sc.crossOrigin = 'anonymous';
  sc.onload = () => { try { if (!Kakao.isInitialized()) Kakao.init(c.kakaoKey); kakaoOn = true; } catch (e) {} };
  document.head.appendChild(sc);
}
function kakaoShare(c) {
  if (!kakaoOn || !window.Kakao) throw new Error('카카오 준비 안 됨');
  const tags = String(c.badges || '').split(',').map(x => x.trim()).filter(Boolean).slice(0, 3).join(' · ');
  const url = /[?&]u=/.test(location.search) ? location.href.split('#')[0] : location.href;
  const img = /^https:\/\//.test(c.kakaoImg || '') ? c.kakaoImg : 'https://hms36903690.github.io/ai-assistant/card-og.png';
  Kakao.Share.sendDefault({objectType: 'feed',
    content: {title: `${c.name || ''} ${[c.org, c.title].filter(Boolean).join(' · ')}`.trim(), description: tags || c.intro || '디지털 명함을 확인하세요.',
      imageUrl: img, imageWidth: 640, imageHeight: c.kakaoImg ? 640 : 336, link: {mobileWebUrl: url, webUrl: url}},
    buttons: [{title: '명함 확인', link: {mobileWebUrl: url, webUrl: url}}]});
}
load().then(c => c ? render(c) : $('app').innerHTML = `<div class="err">명함을 찾지 못했어요.<br>받으신 링크를 다시 눌러 주세요.${loadErr ? `<br><small style="color:#9aa5b1">(${esc(loadErr)})</small>` : ''}</div>`)
  .catch(e => $('app').innerHTML = `<div class="err">명함을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.<br><small style="color:#9aa5b1">(${esc(e.message || e)})</small></div>`);
</script>
</body>
